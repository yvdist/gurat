name: backup

# Weekly D1 export to a private R2 bucket (spec 07 §7.5). Retention is a
# bucket lifecycle rule (keep newest 12), managed once by the owner — not
# per-run object listing (wrangler 4.156.1 exposes no list/delete-object
# query; see docs/runbook.md). `workflow_dispatch` for ad-hoc snapshots
# before risky operations.
on:
  schedule:
    # Every Monday 02:00 WIB = Sunday 19:00 UTC.
    - cron: "0 19 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec wrangler d1 export gurat --remote --output "gurat-$(date -u +%F).sql"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm exec wrangler r2 object put "gurat-backups/backups/gurat-$(date -u +%F).sql" --file "gurat-$(date -u +%F).sql" --remote --content-type application/sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
