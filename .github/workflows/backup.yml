name: backup

# Weekly D1 export to a private R2 bucket (spec 07 §7.5). Retention is an
# age-based bucket lifecycle rule (84-day expiry ≈ 12 weekly backups),
# configured once by the owner via
# `wrangler r2 bucket lifecycle add gurat-backups backups-retention backups/ --expire-days 84`
# — not per-run listing (wrangler 4.156.1 has no object-list query for
# retention scripting). `workflow_dispatch` for ad-hoc snapshots before
# risky operations.
on:
  schedule:
    # Every Monday 02:00 WIB = Sunday 19:00 UTC.
    - cron: "0 19 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `--table` scoping: D1 export cannot dump FTS5 virtual tables
      # (`posts_fts`) — verified against pinned wrangler 4.156.1 on both
      # local and remote. The exclusion is lossless: `posts_fts` is fully
      # derived (structure from migration 0002, content from `pnpm db:rerender`
      # during restore — see docs/runbook.md §2).
      - run: pnpm exec wrangler d1 export gurat --remote --output "gurat-$(date -u +%F).sql" --table posts --table tags --table post_tags --table media --table post_media
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: pnpm exec wrangler r2 object put "gurat-backups/backups/gurat-$(date -u +%F).sql" --file "gurat-$(date -u +%F).sql" --remote --content-type application/sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
