name: deploy

# Production deploy (spec 07 §7.6, ADR-006): owner-pressed only, AFTER the
# owner runs `pnpm db:migrate:remote` explicitly. Additive-only migrations
# keep old code running on the new schema, so this step is code-only.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm types
      - run: pnpm check
      - run: pnpm build
      # `--keep-vars`: never delete dashboard-managed vars on deploy.
      # Without it, Wrangler deletes all vars then sets only those in
      # wrangler.jsonc — which wiped ACCESS_*/ADMIN_EMAILS/MEDIA_BASE_URL
      # to "" on 2026-11-18 (vars block intentionally removed from
      # wrangler.jsonc; dashboard is the single source of truth).
      - run: pnpm exec wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
