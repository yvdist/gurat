name: ci

on:
  push:
    branches: [phase-1]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `src/worker-configuration.d.ts` is gitignored but required for
      # `astro check` (`declare module 'cloudflare:workers'`); regenerate it
      # from wrangler.jsonc before typechecking.
      - run: pnpm types
      - run: pnpm check
